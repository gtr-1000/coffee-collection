<div class="container">

    <h1>Coffee Collection</h1>

    <div class="filters">
        <button id="show-btn">Show All</button>
        <button id="light-btn">Light</button>
        <button id="medium-btn">Medium</button>
        <button id="dark-btn">Dark</button>
    </div>
    <label for="sort-select">Sort by price:</label>

    <select id="sort-select">
      <option value="default">Original order</option>
      <option value="asc">Lowest price first</option>
      <option value="desc">Highest price first</option>
    </select>
        
    <input type="text" id="search-input" placeholder="Search coffee by name...">
    <button id="search-btn">Search</button>
    <ul id="blend-list"></ul>

</div>

<script src="script.js"></script>
